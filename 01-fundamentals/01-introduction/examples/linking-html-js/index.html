<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linking HTML and JS</title>
</head>
<body>

    
    <!-- This is a paragraph element with an id of "external" -->
    <p id="external"></p>

    <!-- script tag is used to include JavaScript code -->
    <script>
        // JavaScript code can be written directly within the script tag
        console.log("Hello from inline JavaScript!");
    </script>

    <!-- src attribute is used to link an external JavaScript file -->
    <script src="./index.js"></script>

    
</body>
</html>
